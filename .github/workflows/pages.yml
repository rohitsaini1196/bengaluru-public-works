# Free hosting: build the static site from the committed public database and publish it to GitHub Pages.
# One-time setup: repository Settings → Pages → Source: "GitHub Actions".
name: Publish site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements-web.txt pytest
      - id: pages
        uses: actions/configure-pages@v5
      - name: Test the public surface and the static export
        run: python -m pytest -q tests/test_public.py tests/test_static.py
      - name: Freeze the site
        env:
          PUBLIC_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: python -m app.freeze --base "${{ steps.pages.outputs.base_path }}/" --out site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
